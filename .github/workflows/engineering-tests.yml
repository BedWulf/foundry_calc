name: Engineering validation (automatic)
on:
  push:
    branches: [worck-branch, main]
    paths:
      - '**/*.py'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/engineering-tests.yml'
  pull_request:
    branches: [main, worck-branch]
  workflow_dispatch:

jobs:
  engineering-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-timeout
      - name: Run complete test suite
        run: python -m pytest -q --timeout=25
