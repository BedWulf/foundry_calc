name: Build Windows EXE (PySide6)
on:
  workflow_dispatch:
  pull_request:
    branches: [engineering-audit-batch-planning-20261028]
  push:
    branches: [engineering-audit-batch-planning-20261028]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'data/**'
      - 'assets/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/windows-exe.yml'
      - 'build_windows.bat'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Build and test using the SAME bat file as on a new Windows PC
        shell: cmd
        env:
          FOUNDRY_BUILD_HOME: ${{ runner.temp }}\FPRO
        run: call build_windows.bat
      - name: Verify packaged EXE and bundled resources
        shell: pwsh
        env:
          FOUNDRY_BUILD_HOME: ${{ runner.temp }}\FPRO
          QT_QPA_PLATFORM: offscreen
          FOUNDRY_SMOKE_TEST: '1'
          FOUNDRY_SMOKE_REPORT: ${{ runner.temp }}\foundry_frozen_smoke_error.txt
        run: |
          $exe = Join-Path $env:FOUNDRY_BUILD_HOME "dist\LiteynyiTsehPRO\LiteynyiTsehPRO.exe"
          if (!(Test-Path $exe)) { throw "EXE not produced by batch builder" }
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(90000)) {
            $p.Kill()
            if (Test-Path $env:FOUNDRY_SMOKE_REPORT) {
              Get-Content -LiteralPath $env:FOUNDRY_SMOKE_REPORT
            }
            throw "Packaged MainWindow/Qt smoke test timed out"
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $env:FOUNDRY_SMOKE_REPORT) {
              Get-Content -LiteralPath $env:FOUNDRY_SMOKE_REPORT
            }
            throw "Packaged MainWindow/Qt smoke failed with exit code $($p.ExitCode)"
          }
          Write-Host "Packaged Qt MainWindow and melting imports OK"
      - name: Upload portable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: LiteynyiTsehPRO-Windows-x64
          path: ${{ runner.temp }}\FPRO\dist\LiteynyiTsehPRO\
          retention-days: 30
          if-no-files-found: error
