name: Calculation checks
on:
  push:
    branches:
      - engineering-audit-batch-planning-20261028
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries for offscreen tests
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest && python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall -q core gui data import_export tests
      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
